<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9fd4f2" />
    <title>羊了个羊</title>
    <meta name="description" content="叠牌三消。只点没被压住的牌，三张一样的收进七格槽里。" />
    <link rel="icon" href="sheep.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="sheep.css?v=3" />
    <script src="brython.min.js"></script>
  </head>
  <body onload="brython({cache: false, debug: 0})">
    <div class="sky">
      <header class="top">
        <div class="top-links">
          <a class="jump" href="saolei.html">扫雷</a>
        </div>
        <div class="brand">
          <svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
            <ellipse cx="22" cy="28" rx="10" ry="12" fill="#fffaf3" />
            <ellipse cx="50" cy="28" rx="10" ry="12" fill="#fffaf3" />
            <circle cx="36" cy="38" r="20" fill="#fffaf3" />
            <circle cx="29" cy="36" r="2.4" fill="#2c241c" />
            <circle cx="43" cy="36" r="2.4" fill="#2c241c" />
            <path d="M30 44c2 3 10 3 12 0" fill="none" stroke="#2c241c" stroke-width="2" stroke-linecap="round" />
            <ellipse cx="36" cy="58" rx="16" ry="6" fill="#7dbb4a" />
          </svg>
          <div>
            <p class="eyebrow">叠牌三消</p>
            <h1>羊了个羊</h1>
          </div>
        </div>
        <p class="lede">第一关点几下就会。第二关中间是一块方阵，左边和底下还压着好几层。七格满了，得抓住那只鸡才能重开。</p>
        <div class="levels" role="group" aria-label="关卡">
          <button type="button" id="level-meadow" class="level is-on">
            第一关
            <span>点几下就会</span>
          </button>
          <button type="button" id="level-mountain" class="level">
            第二关
            <span>中间一块</span>
          </button>
        </div>
      </header>

      <div class="tools">
        <button type="button" id="undo" class="tool">撤回 <b id="undo-left">5</b></button>
        <button type="button" id="shuffle" class="tool">洗牌 <b id="shuffle-left">2</b></button>
        <button type="button" id="moveout" class="tool">移出 <b id="move-left">1</b></button>
        <button type="button" id="restart" class="tool tool-strong">重开</button>
        <p id="status" class="status">正在铺草…</p>
      </div>

      <div id="table" class="table">
        <div id="board-fit" class="board-fit">
          <div id="board" class="board"></div>
        </div>
      </div>

      <div id="banner" class="banner" role="dialog" aria-modal="false">
        <p id="banner-title" class="banner-title"></p>
        <p id="banner-text"></p>
        <div class="banner-actions">
          <button type="button" id="banner-next">重开</button>
          <button type="button" id="banner-stay" class="ghost is-hidden">先不重开</button>
        </div>
      </div>

      <div class="dock-wrap">
        <button type="button" id="pile" class="pile" aria-label="移出来的牌"></button>
        <div id="dock" class="dock" aria-label="七格槽"></div>
      </div>
    </div>
    <div id="litter"></div>
    <button type="button" id="chicken" class="chicken" aria-label="抓住这只鸡才能重开">
      <span class="wake"></span>
      <svg class="bird" viewBox="0 0 80 80" aria-hidden="true">
        <g class="leg leg-a">
          <path d="M26 50v16" stroke="#f29a3a" stroke-width="3.5" stroke-linecap="round" />
          <path d="M21 66h9" stroke="#f29a3a" stroke-width="3.5" stroke-linecap="round" />
        </g>
        <g class="leg leg-b">
          <path d="M38 50v16" stroke="#e07d22" stroke-width="3.5" stroke-linecap="round" />
          <path d="M33 66h9" stroke="#e07d22" stroke-width="3.5" stroke-linecap="round" />
        </g>
        <ellipse cx="34" cy="40" rx="18" ry="13" fill="#ffe27a" />
        <circle cx="52" cy="28" r="12" fill="#ffe27a" />
        <path d="M48 16l6-10 3 10z" fill="#e23d3d" />
        <circle cx="57" cy="26" r="1.8" fill="#2a241c" />
        <path d="M62 30h10l-4 4z" fill="#f29a3a" />
      </svg>
    </button>
    <script type="text/python" src="sheep_ui.py"></script>
  </body>
</html>
